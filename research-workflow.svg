<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 0 800 386" role="img" aria-labelledby="title description">
<title id="title">Two studies of diet in UK children</title>
<desc id="description">NDNS provides data for two separate studies. Free Sugar compares weighted estimates from food diaries and Intake24 recalls in children aged 5–16. Sodium and BMI uses adjusted regression in children aged 4–18 from Years 1–9.</desc>
<style>
